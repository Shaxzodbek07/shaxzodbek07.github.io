<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Silk Road Caravan</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0E1630; }
    #unity-canvas { width: 100vw; height: 100vh; display: block; background: #0E1630; touch-action: none; outline: none; }

    /* Loading screen */
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: #0E1630; color: #E9D3A6; font: 600 20px/1.3 Georgia, "Times New Roman", serif;
      transition: opacity .4s;
    }
    #loading h1 { margin: 0; font-weight: 400; font-size: clamp(28px, 6vw, 48px); letter-spacing: .02em; }
    #bar { width: min(420px, 70vw); height: 8px; border-radius: 4px; background: #23408E; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #E8A63A; transition: width .2s; }

    /* Phones held upright: ask to rotate (the game is made for landscape) */
    #rotate {
      display: none; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center;
      text-align: center; padding: 24px; background: #0E1630; color: #E9D3A6; font: 20px/1.4 Georgia, serif;
    }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  </style>

  <!-- Monetag scripts will be added here later (Step "real ads") -->
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <div id="loading">
    <h1>Silk Road Caravan</h1>
    <div id="bar"><div id="fill"></div></div>
    <div id="percent">Loading the caravan… 0%</div>
  </div>

  <div id="rotate">Turn your phone sideways to play.</div>

  <script src="Build/Builds.loader.js"></script>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loading = document.querySelector("#loading");
    const fill = document.querySelector("#fill");
    const percent = document.querySelector("#percent");

    createUnityInstance(canvas, {
      dataUrl: "Build/Builds.data.unityweb",
      frameworkUrl: "Build/Builds.framework.js.unityweb",
      codeUrl: "Build/Builds.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Shaxzod",
      productName: "Silk Road Caravan",
      productVersion: "0.1.0",
      // Phones have very sharp screens; rendering at full sharpness costs a lot of speed
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
    }, (progress) => {
      const value = Math.round(progress * 100);
      fill.style.width = value + "%";
      percent.textContent = "Loading the caravan… " + value + "%";
    }).then((unityInstance) => {
      window.unityInstance = unityInstance;   // used later by the ad bridge
      loading.style.opacity = "0";
      setTimeout(() => loading.remove(), 400);
      canvas.focus();
    }).catch((message) => {
      percent.textContent = "The game could not start: " + message;
    });
  </script>
</body>
</html>
